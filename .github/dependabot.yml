version: 2
registries:
  tryformation:
    type: maven-repository
    url: https://maven.tryformation.com/releases
multi-ecosystem-groups:
  dependencies:
    schedule:
      interval: "daily"
    commit-message:
      prefix: "⬆️ "
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    multi-ecosystem-group: "dependencies"
    patterns: ["*"]
    cooldown:
      default-days: 7
      exclude:
        - "navikt/sykepenger-github-workflows*"

  - package-ecosystem: "gradle"
    directory: "/"
    registries:
      - tryformation
    multi-ecosystem-group: "dependencies"
    patterns: ["*"]
    cooldown:
      default-days: 7
      exclude:
        - "no.nav.sykepenger.*"
        - "com.github.navikt.tbd-libs:*"
